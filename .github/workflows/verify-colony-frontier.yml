name: Verify Colony Frontier
on:
  push:
    paths:
      - "artifacts/mockup-sandbox/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/verify-colony-frontier.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check mockup sandbox
        run: pnpm --filter @workspace/mockup-sandbox run typecheck
      - name: Build mockup sandbox
        run: pnpm --filter @workspace/mockup-sandbox run build
