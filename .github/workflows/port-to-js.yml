name: Convert TypeScript to JavaScript

on:
  push:
    branches:
      - rust-python-rewrite
    paths:
      - "scripts/migrate_typescript.mjs"
      - ".github/workflows/port-to-js.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-build:
    if: hashFiles('scripts/migrate_typescript.mjs') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: rust-python-rewrite
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install existing workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Convert TypeScript source to JavaScript/JSX and remove TS configs
        run: node scripts/migrate_typescript.mjs

      - name: Synchronize lockfile after removing the TypeScript toolchain
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Build the converted workspace
        run: pnpm run build

      - name: Commit the converted application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Replace TypeScript sources with JavaScript and JSX [skip ci]"
            git push origin rust-python-rewrite
          fi
